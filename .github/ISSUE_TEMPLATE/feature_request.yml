name: Feature or package request
description: Propose a new package, module, or behaviour change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What you are trying to do today, and why the current setup does not cover it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would add or change, and roughly where (`modules/common.nix`, `modules/darwin.nix`, `modules/linux.nix`, `files/`, the installer).
    validations:
      required: true

  - type: dropdown
    id: surfaces
    attributes:
      label: Which surfaces should this cover
      description: >-
        Shared behaviour belongs in `modules/common.nix`; anything platform-only
        belongs in the darwin or linux module. Windows runs the Linux path.
      multiple: true
      options:
        - macOS
        - Linux
        - Windows / WSL2
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you tried or ruled out, including doing it outside Nix.

  - type: checkboxes
    id: offer
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
